name: Build Android APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Configure Godot Android settings
        run: |
          godot --headless --quiet --editor --quit || true
          SETTINGS=$(ls ~/.config/godot/editor_settings-4*.tres)
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          JAVA_PATH="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          {
            echo 'export/android/android_sdk_path = "'"$SDK_PATH"'"'
            echo 'export/android/java_sdk_path = "'"$JAVA_PATH"'"'
            echo 'export/android/debug_keystore = "'"$PWD"'/debug.keystore"'
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo 'export/android/force_system_user = false'
            echo 'export/android/shutdown_adb_on_exit = true'
          } >> "$SETTINGS"

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Smoke test (headless, AI plays a match)
        run: |
          godot --headless --path . --fixed-fps 60 --quit-after 7200 res://scenes/game.tscn -- autoplay 2>&1 | tee smoke.log
          grep -E "SMOKE_STATUS" smoke.log | tail -5 || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid (call|access|get|set)" smoke.log; then
            echo "Smoke test found script errors"; exit 1
          fi
          grep -q "SMOKE_STATUS" smoke.log || { echo "Game produced no status output"; exit 1; }

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/LegendFootball-debug.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: LegendFootball-debug-apk
          path: build/LegendFootball-debug.apk
